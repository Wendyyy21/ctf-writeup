{% assign locale = include.locale | default: site.locale %}
{% assign lang = locale | slice: 0,2 | default: "en" %}
{% case lang %}
{% when "gr" %}
  {% assign lang = "gr" %}
{% else %}
  {% assign lang = "en" %}
{% endcase %}
<script src="{{ '/assets/js/lunr/lunr-store.js' | relative_url }}"></script>
